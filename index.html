<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Todo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="login" hidden>
    <h1>Todo</h1>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button>Sign in</button>
    <p id="error"></p>
  </form>

  <dialog id="confirm">
    <p>Log out of your account?</p>
    <div>
      <button id="cancel">Cancel</button>
      <button id="confirm-out">Log out</button>
    </div>
  </dialog>

  <main id="app" hidden>
    <nav>
      <button id="tab-todos" class="active">Todos</button>
      <button id="tab-notes">Notes</button>
      <button id="logout" title="Log out" aria-label="Log out"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </nav>

    <section id="todos">
      <form id="add">
        <input id="new" placeholder="Add a task" autocomplete="off" required>
        <input id="date" type="date" required>
      </form>
      <ul id="list" class="tasks"></ul>
    </section>

    <section id="notes" hidden>
      <textarea id="note" placeholder="Write anything"></textarea>
    </section>
  </main>

  <p id="status" hidden></p>

  <script type="module" src="app.js"></script>
</body>
</html>
