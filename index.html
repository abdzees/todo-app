<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Todo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="login" hidden>
    <h1>Todo</h1>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button>Sign in</button>
    <p id="error"></p>
  </form>

  <main id="app" hidden>
    <nav>
      <button id="tab-todos" class="active">Todos</button>
      <button id="tab-notes">Notes</button>
      <button id="tab-removed">Removed</button>
      <button id="logout">Log out</button>
    </nav>

    <section id="todos">
      <form id="add">
        <input id="new" placeholder="Add a task" autocomplete="off" required>
        <input id="date" type="date" required>
      </form>
      <ul id="list" class="tasks"></ul>
    </section>

    <section id="notes" hidden>
      <textarea id="note" placeholder="Write anything"></textarea>
    </section>

    <section id="removed" hidden>
      <div id="bar">
        <label><input type="checkbox" id="select-all"> Select all</label>
        <button id="delete-selected" disabled>Delete forever</button>
      </div>
      <ul id="trash" class="tasks"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
